name: 'Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release type or explicit version (e.g. patch, minor, major, 1.2.3)'
        required: true
        default: 'patch'
        type: string
      release_notes:
        description: "Optional Markdown prefix for release notes; supports GFM alerts and uses \\n for line breaks"
        required: false
        default: "> [!NOTE]\\n> Add manual release notes here"
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      changelog: ${{ steps.release.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm/setup 一步安装 pnpm 与 Node.js，并自动执行 pnpm install（工作区存在 package.json 时）
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - name: Validate update signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '::error::缺少 TAURI_SIGNING_PRIVATE_KEY，不能生成可验签的更新包'
            exit 1
          fi

      - name: Validate macOS signing and notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for release_secret_name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!release_secret_name}" ]; then
              echo "::error::缺少 ${release_secret_name}，不能发布 macOS 正式安装包"
              exit 1
            fi
          done

      - name: Check code
        run: pnpm run check

      - name: Configure Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Run release-it
        id: release
        run: |
          npx release-it --ci "$RELEASE_VERSION" --git.tagExclude="*[-]*"

          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          CHANGELOG=$(awk '/^## \[/{if(c++) exit}c' CHANGELOG.md)

          # 如果用户提供了自定义 release notes（非默认模板），则追加到 changelog 之前
          NOTES="$RELEASE_NOTES"
          DEFAULT='> [!NOTE]\n> Add manual release notes here'
          if [ -n "$NOTES" ] && [ "$NOTES" != "$DEFAULT" ]; then
            NOTES=$(printf '%b' "$NOTES")
            CHANGELOG=$(printf '%s\n\n%s' "$NOTES" "$CHANGELOG")
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: bump
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.bump.outputs.version }}

      # pnpm/setup 一步安装 pnpm 与 Node.js，并自动执行 pnpm install（工作区存在 package.json 时）
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check code and tests
        run: |
          pnpm run check
          pnpm run test:rust

      - name: Create .env.local file
        env:
          APP_ID: ${{ secrets.APP_ID || vars.APP_ID }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          cp .env .env.local
          if [ -n "$APP_ID" ]; then
            printf 'VITE_APP_ID=%s\n' "$APP_ID" >> .env.local
          fi
          if [ -n "$APP_KEY" ]; then
            printf 'VITE_APP_KEY=%s\n' "$APP_KEY" >> .env.local
          fi
        shell: bash

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: '115+ v__VERSION__'
          releaseBody: ${{ needs.bump.outputs.changelog }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
